<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script type="module" src="./assets/js/app.js"></script>
</head>
<body>
    <div class="container" id="app">
        <h1 :title="about">{{title}}</h1>
        <h3>Кол-во:
            <button @click="decCount">-</button>
            {{count}}
            <button @click="incCount">+</button>
            шт.
            х
            {{price}} грн./шт
            =
            {{cost}} грн.
        </h3>
        <h4>Итого стоимость с налогом {{taxRate}}%: {{totalCost}} грн.</h4>
        <div v-show="count >= 15" class="alert alert-danger">За 15 молотков доставка бесплатно*!!!</div>
        <div v-show="cost >= 2000"> При заказе от 2000 грн, скидка 10%</div>
    </div>
</body>
</html>
